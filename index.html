<title>Consulta de Alarmes PLC - EH Tech Automation Works</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#0e7490;--bt:#fff;--ok:#047857;--err:#b91c1c;--chip:#e0f2fe;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#162033;--text:#e2e8f0;--muted:#94a3b8;--line:#26334a;--brand:#22d3ee;--bt:#06222b;--ok:#34d399;--err:#f87171;--chip:#1e3a4a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);min-height:100vh}
main{max-width:560px;margin:0 auto;padding:20px 0 28px}
h1{font-size:1.25rem;margin:0 0 4px}.sub{color:var(--muted);font-size:.9rem;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font-size:1.4rem;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);outline:none}
input:focus{border-color:var(--brand)}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
.primary{background:var(--brand);color:var(--bt)}.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.hint{color:var(--muted);font-size:.8rem;margin:8px 0 0}
.seg{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:.85rem;color:var(--muted)}
.seg button{padding:6px 12px;font-size:.85rem;background:transparent;color:var(--muted);border:1px solid var(--line)}
.seg button.on{background:var(--brand);color:var(--bt);border-color:var(--brand)}
#out{margin-top:16px}
.big{font-family:ui-monospace,Consolas,Menlo,monospace;font-size:1.35rem;font-weight:700;word-break:break-word;color:var(--ok)}
.msg{color:var(--muted);white-space:pre-line}.msg.err{color:var(--err)}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:14px 0 0;font-size:.95rem}
dt{color:var(--muted)}dd{margin:0;font-weight:600;word-break:break-word}
.alt{font-weight:400;color:var(--muted);font-size:.85rem}
.actions{display:flex;gap:8px;margin-top:14px}.actions button{padding:10px 14px}
.list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.item{display:flex;gap:10px;text-align:left;background:var(--bg);color:var(--text);border:1px solid var(--line);padding:10px 12px;font-weight:500;font-size:.9rem}
.item b{font-family:ui-monospace,Consolas,monospace}
.hist{margin-top:16px}.hist h2{font-size:.85rem;color:var(--muted);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--chip);color:var(--text);padding:8px 12px;border-radius:999px;font-size:.9rem}
body{display:flex;flex-direction:column}main{width:100%}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}.top img{width:56px;height:56px;border-radius:14px;flex:none}
.top h1{margin:0}.top .sub{margin:2px 0 0}
.brand{margin:8px -16px 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:#0b1a33;text-align:center;font-weight:700;font-size:1.1rem;letter-spacing:.2px}
.brand b{color:#38bdf8}.brand span{color:#e2e8f0}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:18px}
</style>
</head>

const K = Object.keys(D).map(Number).sort((a, b) => a - b);
const GR = {0:["Bloqueio de avanço","Feedrate disable"],1:["Bloqueio de avanço e de leitura","Feedrate and read-in disable"],2:["Bloqueio de leitura","Read-in disable"],3:["Bloqueio de NC Start","NC start disable"],11:["Parada de avanço, eixo geométrico 1","Feedrate stop, geo axis 1"],12:["Parada de avanço, eixo geométrico 2","Feedrate stop, geo axis 2"],13:["Parada de avanço, eixo geométrico 3","Feedrate stop, geo axis 3"]};
const $ = id => document.getElementById(id);
const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
let modo = "FALSE", atual = null, hist = [];
try { modo = localStorage.getItem("modo") || "FALSE"; hist = JSON.parse(localStorage.getItem("hist") || "[]"); } catch (e) {}

const I = {}, H = {}, R = {FALSE: {}, TRUE: {}};
K.forEach(n => {
  const t = D[n], m = t.match(/DB2\.DBX (\d+)\.(\d)/), by = +m[1], bit = +m[2];
  let local, grupo, delta;
  if (n >= 700000) { local = "Faixa de usuário " + (((n - 700000) / 100) | 0); grupo = "Mensagem definida pelo programa PLC"; delta = 374; }
  else if (n >= 600000) { local = "Eixo/spindle " + (((n - 600000) / 100) | 0); grupo = "Parada de avanço / parada de spindle (Feedrate stop / spindle stop)"; delta = 346; }
  else { const g = GR[((n % 10000) / 100) | 0]; local = "Canal " + ((n / 10000 | 0) - 50); grupo = g[0] + " (" + g[1] + ")"; delta = 310; }
  const tipo = t.trim().split(/\s+/).pop();
  I[n] = {by, bit, delta, local, grupo, tipo};
  H[n] = norm(t + " " + local + " " + grupo + " " + (tipo === "FM" ? "falha" : "operacional"));
  R.FALSE[by + "." + bit] = n; R.TRUE[(by + delta) + "." + bit] = n;
});
const end = (n, m) => "DB2.DBX " + (I[n].by + (m === "TRUE" ? I[n].delta : 0)) + "." + I[n].bit;

function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }
function msg(txt, err) { const o = $("out"); o.textContent = ""; o.appendChild(el("div", "msg" + (err ? " err" : ""), txt)); atual = null; }

function mostrar(n) {
  atual = n; const i = I[n], o = $("out"); o.textContent = "";
  o.appendChild(el("div", "big", D[n]));
  const dl = el("dl");
  const outro = modo === "FALSE" ? "TRUE" : "FALSE";
  const linhas = [
    ["Alarme nº", String(n)],
    ["Tipo", i.tipo === "FM" ? "Mensagem de falha (FM)" : "Mensagem operacional (BM/OM)"],
    ["Local", i.local], ["Função", i.grupo],
    ["Endereço PLC", end(n, modo)],
  ];
  linhas.forEach(([a, b]) => { dl.appendChild(el("dt", "", a)); const dd = el("dd", "", b); dl.appendChild(dd); });
  const dd = dl.lastChild; dd.appendChild(el("div", "alt", "Com ExtendAIMsg = " + outro + ": " + end(n, outro)));
  o.appendChild(dl);
  o.appendChild(el("div", "hint", "O alarme é ativado quando esse bit do DB2 vai a 1 no PLC."));
  const ac = el("div", "actions");
  const ant = el("button", "ghost", "◀"), prx = el("button", "ghost", "▶"), cp = el("button", "ghost", "Copiar");
  const pos = K.indexOf(n);
  ant.onclick = () => { if (pos > 0) irPara(K[pos - 1]); };
  prx.onclick = () => { if (pos < K.length - 1) irPara(K[pos + 1]); };
  cp.onclick = async () => { const t = n + " - " + D[n] + " - " + end(n, modo); try { await navigator.clipboard.writeText(t); cp.textContent = "Copiado"; } catch (e) {} };
  [ant, prx, cp].forEach(b => ac.appendChild(b)); o.appendChild(ac);
}

function irPara(n) { $("q").value = String(n); mostrar(n); guardar(n); }

function lista(ns, titulo) {
  const o = $("out"); o.textContent = ""; atual = null;
  o.appendChild(el("div", "msg", titulo));
  const l = el("div", "list");
  ns.slice(0, 40).forEach(n => {
    const b = el("button", "item"); b.appendChild(el("b", "", String(n))); b.appendChild(el("span", "", D[n]));
    b.onclick = () => irPara(n); l.appendChild(b);
  });
  o.appendChild(l);
}

function consultar(avisar) {
  const v = $("q").value.trim(); if (!v) { if (avisar) msg("Digite um número, endereço ou texto."); return; }
  const compacto = v.replace(/\s+/g, "");
  if (/^\d+$/.test(v)) {
    const n = parseInt(v, 10);
    if (D[n] !== undefined) { mostrar(n); if (avisar || v.length >= 6) guardar(n); }
    else if (avisar) {
      let p = K.findIndex(k => k >= n); if (p < 0) p = K.length;
      const viz = K.slice(Math.max(0, p - 1), p + 1);
      msg("Alarme " + n + " não encontrado." + (viz.length ? "\nMais próximos: " + viz.join(", ") : ""), true);
    }
    return;
  }
  const a = compacto.match(/^(?:db2\.?dbx?)?(\d+)\.([0-7])$/i);
  if (a) {
    const n = R[modo][parseInt(a[1], 10) + "." + a[2]];
    if (n) { mostrar(n); guardar(n); } else if (avisar) msg("Nenhum alarme no endereço DB2.DBX " + a[1] + "." + a[2] + " (modo " + modo + ").", true);
    return;
  }
  if (v.length < 2) return;
  const tk = norm(v).split(/\s+/), r = K.filter(n => tk.every(t => H[n].includes(t)));
  if (r.length === 1) mostrar(r[0]);
  else if (r.length) lista(r, r.length + " alarmes encontrados" + (r.length > 40 ? " (mostrando 40)" : "") + ":");
  else if (avisar) msg("Nada encontrado para “" + v + "”.", true);
}

function guardar(n) {
  n = String(n); hist = [n].concat(hist.filter(x => x !== n)).slice(0, 8);
  try { localStorage.setItem("hist", JSON.stringify(hist)); } catch (e) {}
  chips();
}
function chips() {
  const c = $("chips"); c.textContent = "";
  hist.forEach(n => { const b = el("button", "chip", n); b.onclick = () => irPara(+n); c.appendChild(b); });
  $("hb").hidden = !hist.length;
}
function setModo(m) {
  modo = m; try { localStorage.setItem("modo", m); } catch (e) {}
  $("mF").className = m === "FALSE" ? "on" : ""; $("mT").className = m === "TRUE" ? "on" : "";
  if (atual) mostrar(atual); else consultar(false);
}

$("q").addEventListener("input", () => consultar(false));
